
name: Run PHP Script Daily

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

jobs:
  run-php:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Execute PHP script
        run: php daily-script.php
